name = "cloud-resume-counter"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Your Cloudflare account ID (Dashboard -> Workers & Pages -> right sidebar)
account_id = "c988b04a5bee367b23135b9e3f24e5cd"

# KV namespace that stores the visit count.
# Get the id by running: wrangler kv namespace create "VISIT_COUNTER"
[[kv_namespaces]]
binding = "VISIT_COUNTER"
id = "650b20294fc9471b9a104ec2ed032b4c"
